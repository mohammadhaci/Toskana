name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e .[dev]
      - name: Ruff (lint + format)
        run: |
          ruff check .
          ruff format --check .
      - name: Mypy
        run: mypy
      - name: Pytest (excludes @ml and @slow)
        run: pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
      - name: Check (tsc --noEmit + i18n key parity)
        run: npm run check
      - name: Vitest
        run: npm test
      - name: Build (tsc + vite build)
        run: npm run build
